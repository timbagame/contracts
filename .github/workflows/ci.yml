name: Contracts TypeScript CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal
      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --tag v0.32.1 --locked
      - name: Install Solana tools (Agave 2.2.2)
        run: |
          curl -L -o solana.tar.bz2 https://release.anza.xyz/v2.2.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          mkdir -p "$HOME/.local/share/solana/install/releases/v2.2.2"
          tar -xjf solana.tar.bz2 -C "$HOME/.local/share/solana/install/releases/v2.2.2" --strip-components=1
          ln -sfn "$HOME/.local/share/solana/install/releases/v2.2.2" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" update
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build (slim features)
        run: bun run build:prod
      - name: Typecheck tests
        run: bunx tsc -p tsconfig.json --noEmit
