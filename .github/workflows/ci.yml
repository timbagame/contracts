name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # mise installs only what mise.lock lists, checking each download's checksum.
  MISE_LOCKED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # EVM contracts
  evm:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Remappings point only at the top-level libs; their nested submodules are unused.
          submodules: true
      - name: Install Bun and Foundry
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: bun github:foundry-rs/foundry
          cache_key_prefix: mise-evm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.svm
            evm/cache
            evm/out
          key: evm-${{ runner.os }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('evm/foundry.toml', 'evm/foundry.lock', 'evm/src/**', 'evm/test/**', 'evm/script/**') }}
          # Forge's compilation cache is incremental, so a stale entry still saves recompiling unchanged files.
          restore-keys: |
            evm-${{ runner.os }}-${{ hashFiles('mise.lock') }}-
      - name: Format
        run: forge fmt --check
      - name: Build and check deployment size
        run: forge build --sizes
      - name: Tests, fuzzing, invariants and gas report
        run: forge test --gas-report
      - name: Measure contract coverage
        run: |
          mkdir -p coverage
          forge coverage --exclude-tests --report lcov --report-file coverage/lcov.info
      - name: Test coverage gate
        working-directory: .
        run: bun test scripts/check-coverage.test.ts
      - name: Enforce 100% line coverage
        working-directory: .
        run: bun run scripts/check-coverage.ts coverage-evm.json evm/coverage/lcov.info
      - name: Upload EVM coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-evm
          path: evm/coverage/
          if-no-files-found: error
      - name: Local RPC lifecycle smoke test
        run: bash script/local-smoke.sh
      - name: Verify exported ABI
        run: |
          forge inspect Timba abi --json > abi/Timba.json
          git diff --exit-code -- abi/Timba.json

  # Solana program
  # Fast checks that need neither the Solana toolchain nor a program build.
  lint:
    defaults:
      run:
        working-directory: solana
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install Bun
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: bun
          cache_key_prefix: mise-lint

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('solana/bun.lock', 'solana/package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # target/idl and target/types are committed; the build job checks them for drift.
      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Test coverage gate
        working-directory: .
        run: bun test scripts/*.test.ts

  solana:
    defaults:
      run:
        working-directory: solana
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install Bun, Solana CLI, Surfpool, Anchor CLI and cargo-llvm-cov
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: bun github:anza-xyz/agave github:solana-foundation/surfpool github:solana-foundation/anchor cargo:cargo-llvm-cov
          cache_key_prefix: mise-solana

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('solana/bun.lock', 'solana/package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # cargo-build-sbf downloads its platform tools into ~/.cache/solana on first use.
      - name: Cache SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solana
          key: sbf-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
            !solana/target/idl
            !solana/target/types
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock', 'solana/rust-toolchain.toml') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-

      - name: Restore generated clients
        run: git restore --source=HEAD -- target/idl target/types

      - name: Create test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json

      - name: Build program and generated clients
        run: |
          anchor build --ignore-keys
          bun run generate:client

      - name: Check generated client drift
        run: git diff --exit-code -- target/idl target/types tests/generated

      # LiteSVM tests embed target/deploy/timba.so during compilation.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run test suite
        run: anchor test --skip-build

      - name: Build SBF with source locations for coverage
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "2"
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          anchor build --ignore-keys --no-idl -- --disable-remap-cwd
          # Anchor 1.2.0's DWARF lookup uses the older target directory name.
          mkdir -p target/sbpf-solana-solana/release
          cp target/sbpfv3-solana-solana/release/timba.so target/sbpf-solana-solana/release/timba.so
      - name: Collect SBF execution traces
        env:
          SBF_TRACE_DIR: ${{ github.workspace }}/solana/target/coverage/traces
          SBF_TRACE_FILTER: program_id == 32Jr4JnXWvqq9GqPQynkooHsszaucUUvZfNLh2hdX2L5
        run: |
          rm -rf target/coverage
          cargo test -p timba-test-harness --features coverage
      - name: Generate Solana source coverage
        run: anchor coverage --skip-run --output target/coverage/sbf.lcov
      - name: Measure host-side defensive paths
        run: |
          cargo llvm-cov -p timba-test-harness --lib --test game_state --lcov --output-path target/coverage/host.lcov
      - name: Supplement SBF inventory with matching host source hits
        working-directory: .
        run: bun run scripts/supplement-sbf-coverage.ts solana/target/coverage/sbf.lcov solana/target/coverage/host.lcov solana/target/coverage/combined.lcov
      - name: Enforce 100% line coverage
        working-directory: .
        run: bun run scripts/check-coverage.ts coverage-solana.json solana/target/coverage/combined.lcov
      - name: Upload Solana coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-solana
          path: solana/target/coverage/*.lcov
          if-no-files-found: error

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - evm
      - lint
      - solana
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
