name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: 1.98.1
  BUN_VERSION: 1.4.1
  SOLANA_VERSION: 4.2.2
  SOLANA_SHA256: 5fc8684f7430038105fde953d4308ed56addf627f658daa61709f345448247ee
  ANCHOR_VERSION: 1.2.0
  ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
  SURFPOOL_VERSION: v1.5.0
  SURFPOOL_SHA256: 5b20a3b46e60c4f819af7b4da5c3ea211f76041710617841cc23247d15887ddc

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          curl -fsSL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o "$RUNNER_TEMP/agave.tar.bz2"
          echo "${SOLANA_SHA256}  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          curl -fsSL "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" -o /tmp/anchor
          echo "${ANCHOR_SHA256}  /tmp/anchor" | sha256sum --check
          install -Dm755 /tmp/anchor "$HOME/.local/bin/anchor"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/idl
            !target/types
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-

      - name: Restore generated clients
        run: git restore --source=HEAD -- target/idl target/types

      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Create test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json

      - name: Build program and generated clients
        run: |
          anchor build --ignore-keys
          bun run generate:client

      - name: Check generated client drift
        run: git diff --exit-code -- target/idl target/types tests/generated

      - name: Upload candidate program
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-program
          path: target/deploy/timba.so
          retention-days: 2
          if-no-files-found: error

      - name: Run test suite
        run: anchor test --skip-build --validator legacy

  integration:
    name: Validator integration
    needs: contracts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: workspace/contracts
          persist-credentials: false
      - name: Select integration scope
        id: scope
        shell: bash
        working-directory: workspace/contracts
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [[ "$EVENT" == pull_request ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/integration-paths"
            grep -Ev '(^|/)(README[^/]*|[^/]+\.md)$|^\.(gitignore|prettierignore)$' "$RUNNER_TEMP/integration-paths" > "$RUNNER_TEMP/runtime-paths" || [[ $? == 1 ]]
            if [[ ! -s "$RUNNER_TEMP/runtime-paths" ]]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Checkout integration runner
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: timbagame/operations
          ref: test/validator-integration-and-toolchains
          path: workspace/operations
          token: ${{ secrets.INTEGRATION_READ_TOKEN }}
          persist-credentials: false
      - uses: ./workspace/operations/.github/actions/integration
        if: steps.scope.outputs.run == 'true'
        with:
          candidate: contracts
          read-token: ${{ secrets.INTEGRATION_READ_TOKEN }}
          web: "false"
