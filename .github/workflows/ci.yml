name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: 3.1.10
  ANCHOR_VERSION: 1.1.2
  ANCHOR_SHA256: fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1
  SURFPOOL_VERSION: v1.4.0
  SURFPOOL_SHA256: b65e3e18da8e97a0558e04693d76a12aa31111c7d74958da7cee0fd2eeb4cae8

jobs:
  contracts:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Surfpool
        run: |
          curl -fsSL "https://github.com/solana-foundation/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz" -o /tmp/surfpool.tar.gz
          echo "${SURFPOOL_SHA256}  /tmp/surfpool.tar.gz" | sha256sum --check
          tar -xzf /tmp/surfpool.tar.gz -C /tmp
          install -Dm755 /tmp/surfpool "$HOME/.local/bin/surfpool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          curl -fsSL "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" -o /tmp/anchor
          echo "${ANCHOR_SHA256}  /tmp/anchor" | sha256sum --check
          install -Dm755 /tmp/anchor "$HOME/.local/bin/anchor"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/idl
            !target/types
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-

      - name: Restore generated clients
        run: git restore --source=HEAD -- target/idl target/types

      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Create test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json

      - name: Build program and generated clients
        run: anchor build --ignore-keys

      - name: Check generated IDL and TypeScript client drift
        run: git diff --exit-code -- target/idl target/types

      - name: Run test suite
        run: anchor test --skip-build
