[toolchain]
anchor_version = "0.31.1"
solana_version = "2.3.12"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
timba = "BpdzqWdNJfgeVCsFHppS4WgeRZSRxt5iSj6xH4QdeR7t"

[programs.devnet]
timba = "BpdzqWdNJfgeVCsFHppS4WgeRZSRxt5iSj6xH4QdeR7t"

[programs.localnet]
timba = "BpdzqWdNJfgeVCsFHppS4WgeRZSRxt5iSj6xH4QdeR7t"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet  = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.test.ts'"

# Faster, more realistic local testing
[test]
startup_wait = 8000
