[toolchain]
anchor_version = "0.31.1"
solana_version = "2.3.12"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
timba = "9MmCPEForkbt1L4Dk5BCd9ttErJiehwtdD4mM5J8YbFd"

[programs.localnet]
timba = "9MmCPEForkbt1L4Dk5BCd9ttErJiehwtdD4mM5J8YbFd"

[programs.mainnet]
timba = "9MmCPEForkbt1L4Dk5BCd9ttErJiehwtdD4mM5J8YbFd"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.test.ts'"

[test]
startup_wait = 8000
shutdown_wait = 2000
upgradeable = false
