[toolchain]
anchor_version = "1.2.0"
solana_version = "4.2.2"
package_manager = "bun"

[features]
resolution = true
skip-lint = false

[programs.devnet]
timba = "32Jr4JnXWvqq9GqPQynkooHsszaucUUvZfNLh2hdX2L5"

[programs.localnet]
timba = "32Jr4JnXWvqq9GqPQynkooHsszaucUUvZfNLh2hdX2L5"

[programs.mainnet]
timba = "32Jr4JnXWvqq9GqPQynkooHsszaucUUvZfNLh2hdX2L5"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test -p timba-test-harness && bun test --max-concurrency 1 --timeout 1000000 tests"

[test]
startup_wait = 8000
shutdown_wait = 2000
upgradeable = true
