[workspace]
members  = ["programs/*", "test-harness"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=1.2.0"
anchor-spl  = { version = "=1.2.0", default-features = false }
solana-sha256-hasher = "3.1.0"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
strip           = true
debug           = false
panic           = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level       = "z"
incremental     = false
codegen-units   = 1
