[workspace]
members  = ["programs/*", "crates/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.32.1"
anchor-spl  = { version = "0.32.1", default-features = false }
solana-sha256-hasher = "3.0.0"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
strip           = true
debug           = false
panic           = "abort"
overflow-checks = false          # was true → wastes compute in prod

[profile.release.build-override]
opt-level       = "z"
incremental     = false
codegen-units   = 1
