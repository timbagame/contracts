[workspace]
members  = ["programs/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl  = { version = "0.31.1", default-features = false }

[profile.dev]
overflow-checks = true

[profile.release]
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
strip           = true
debug           = false
panic           = "abort"
overflow-checks = false          # was true → wastes compute in prod

[profile.release.build-override]
opt-level       = "z"
incremental     = false
codegen-units   = 1
