[package]
name         = "timba"
version      = "0.3.0"
description  = "Timba on-chain game contracts built with Anchor"
license      = "BUSL-1.1"
edition      = "2021"
autotests    = false

[lib]
crate-type = ["cdylib"]
name = "timba"

[features]
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = [
  "anchor-lang/idl-build",
  "anchor-spl/idl-build",
  # Anchor SPL 1.2.0's IDL builder references token-interface types
  # unconditionally. This feature is IDL-only and is not in the SBF build.
  "anchor-spl/token_2022",
]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl  = { workspace = true, features = ["token", "associated_token"] }
solana-sha256-hasher = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
