[package]
name         = "timba"
version      = "0.1.0"
description  = "Created with Anchor"
edition      = "2021"

[lib]
crate-type = ["cdylib"]
name = "timba"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
  "anchor-lang/idl-build",
  "anchor-spl/idl-build",
  "anchor-spl/token_2022",      # keep if you intend 2022 types in IDL
]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl  = { workspace = true, default-features = false, features = [
  "token",
  "associated_token",
  "token_2022"                  # add to match your idl-build choice
]}
