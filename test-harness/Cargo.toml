[package]
name = "timba-test-harness"
version = "0.2.0"
edition = "2021"
publish = false

# Compile the exact program source as an rlib for host-side LiteSVM tests.
# The deployable package stays cdylib-only so its release profile can use LTO.
[lib]
name = "timba"
path = "../programs/timba/src/lib.rs"

[features]
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token", "associated_token"] }
solana-sha256-hasher = { workspace = true }

[dev-dependencies]
base64 = "0.21.7"
bincode = "1.3"
litesvm = "0.10.0"
solana-instruction = "3.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-transaction = "3.0.2"
solana-transaction-error = "3.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[[test]]
name = "authorization_litesvm"
path = "../programs/timba/tests/authorization_litesvm.rs"

